# GitHub Marketplace: the name must not match an existing GitHub user or organisation (a user
# `dunstan` exists), and the description must be under 125 characters.
# In full: checks a coding agent's declared handback block against the pull request's own record and
# reports the verdict as a `dunstan` check run, the job summary and the workflow artifact
# `dunstan-record`.
name: Dunstan Handback Check
description: "Verify an AI coding agent's pull request claims against GitHub's own record, with a verdict anyone can rerun. No LLM."
author: Barg Labs

inputs:
  report-source:
    description: >-
      Where the report is, declared, never guessed. One of `pr-body`, `comment:<author-login>` (that
      author's newest comment on the pull request) or `file:<path>` (a file in the workspace; refused
      under pull_request_target). Required: with no value the check concludes failure.
    required: true
  github-token:
    description: >-
      Token for the GitHub API. Needs contents: read, pull-requests: read, issues: read, deployments: read,
      checks: write and actions: read.
    required: false
    default: ${{ github.token }}
  unverifiable-conclusion:
    description: >-
      The check-run conclusion for an `unverifiable` verdict: `failure` (default) or `neutral`.
      GitHub lets a merge through on a neutral required check, so `neutral` lets claims the record
      cannot answer merge.
    required: false
    default: failure
  sign-key-path:
    description: >-
      Optional. Path to an SSH private key: the record is written as its JCS bytes with a detached
      signature, uploaded beside it. Needs `signer`.
    required: false
  signer:
    description: The signer principal recorded as the assurance issuer. Required with sign-key-path.
    required: false
  advisory:
    description: >-
      `true` also reads the report's prose for asserted claims and records each, compared with the
      evidence, as an advisory (DRAFT 0.2.0, docs/advisory.md). Advisories never change the verdict
      or the conclusion. `false` (default) leaves the record as it was.
    required: false
    default: 'false'
  base-tests:
    description: >-
      `true` also reads each declared junit test record's counts, with skipped test cases, at the
      pull request's base commit and at the head, into a baseline (DRAFT 0.2.0, spec D.13). The
      summary shows them, and a rise in skipped tests, as context. A baseline never changes the
      verdict or the conclusion. `false` (default) leaves the record as it was.
    required: false
    default: 'false'
  test-paths:
    description: >-
      Optional. The files you count as tests, one glob per line (`*_test.go`, `src/**/*.test.ts`,
      `tests/**`): a pattern without `/` matches a file name in any directory. `dunstan init`
      proposes them from the test runners it finds; accept or edit them here. The summary then lists
      each changed test file as context, and the record keeps the patterns (DRAFT 0.2.0, spec D.14).
      They never change the verdict or the conclusion. Empty (default) leaves the record as it was.
    required: false
    default: ''

outputs:
  verdict:
    description: >-
      The record's verdict, `pass`, `fail` or `unverifiable`; `error` when no record was written.
  record-path:
    description: Path of the record on the runner; empty when no record was written.

runs:
  using: node24
  main: action/dist/index.mjs

branding:
  icon: check-square
  color: gray-dark
