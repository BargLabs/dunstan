name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test

      # Acceptance (d): every fixture's claims, verdict and digests on this machine, plus the digest
      # of the checker bundle built here. The cross-machine job compares them byte for byte.
      - name: Build the checker bundles
        run: pnpm run build
      # The hosted Worker (docs/hosted.md): built here so a deploy builds from a commit CI has built.
      # The test step above already ran this build inside workerd (hosted/test/worker.test.ts).
      - name: Build the hosted Worker
        run: pnpm run build:hosted
      # The Action runs the committed action/dist/index.mjs, never a build: it must be the build of
      # the source in this commit.
      - name: The committed Action bundle matches the source
        run: |
          git status --porcelain -- action/dist
          test -z "$(git status --porcelain -- action/dist)" || {
            echo "action/dist differs from the build of src/: run pnpm build and commit action/dist" >&2
            git diff --stat -- action/dist >&2
            exit 1
          }
      - name: Write the determinism files
        env:
          DUNSTAN_DETERMINISM_OUT: determinism.jsonl
          DUNSTAN_RESULTS_OUT: results.md
        run: |
          pnpm exec vitest run src/acceptance
          node -e "const c=require('node:crypto'),f=require('node:fs');f.writeFileSync('checker-digest.txt',c.createHash('sha256').update(f.readFileSync('dist/dunstan.mjs')).digest('hex')+'  dist/dunstan.mjs\n')"
          cat checker-digest.txt
          wc -l determinism.jsonl
          cat results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: determinism-${{ matrix.os }}
          path: |
            determinism.jsonl
            checker-digest.txt
          if-no-files-found: error

  # Hosted acceptance (ii): `dunstan verify` passes on a hosted record on a machine with no network.
  # The record, its signature and the allowed-signers file come from hosted/test/offline-verify.test.ts
  # (the hosted handler, GitHub stubbed from recorded responses); the built CLI then verifies them
  # inside a fresh network namespace, which has no interface but a downed loopback.
  hosted-offline-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Write a hosted record
        env:
          DUNSTAN_HOSTED_RECORD_OUT: ${{ runner.temp }}/hosted-record
        run: pnpm exec vitest run hosted/test/offline-verify.test.ts
      - name: Build the CLI
        run: pnpm run build
      - name: dunstan verify with networking disabled
        env:
          RECORD_DIR: ${{ runner.temp }}/hosted-record
        run: |
          record="$(ls "$RECORD_DIR"/dunstan-*.json)"
          sudo unshare --net -- sudo -u "$(id -un)" env "PATH=$PATH" bash -euo pipefail -c '
            ip -brief link
            if node -e "fetch(\"https://api.github.com\").then(() => process.exit(1), () => process.exit(0))"; then
              echo "network: unreachable, as intended"
            else
              echo "network: reachable; this job proves nothing" >&2
              exit 1
            fi
            node dist/dunstan.mjs verify "$1" --sig "$1.sig" --allowed-signers "$2"
          ' verify "$record" "$RECORD_DIR/record-signers"

  cross-machine:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: determinism-*
          path: determinism
      - name: Compare ubuntu-latest with macos-latest
        run: |
          a=determinism/determinism-ubuntu-latest
          b=determinism/determinism-macos-latest
          echo "fixtures: $(wc -l < "$a/determinism.jsonl") on ubuntu, $(wc -l < "$b/determinism.jsonl") on macos"
          test -s "$a/determinism.jsonl"
          cmp "$a/determinism.jsonl" "$b/determinism.jsonl"
          echo "claims, verdicts and digests: identical"
          cat "$a/checker-digest.txt" "$b/checker-digest.txt"
          cmp "$a/checker-digest.txt" "$b/checker-digest.txt"
          echo "checker bundle digest: identical"
